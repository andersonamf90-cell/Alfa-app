<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262626">
<link rel="manifest" href="manifest-proposta.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Proposta Alfa</title>
<style>
:root{--y:#F9C801;--yt:#3d3200;--bg:#f4f4f2;--card:#fff;--ink:#1e1e1e;--mut:#5c5c5c;--line:#d9d9d4;--dark:#262626;--fld:#fafaf8}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f1f1ee;--mut:#a8a8a2;--line:#3a3a36;--fld:#2a2a28}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--dark);border-bottom:4px solid var(--y);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
header img{height:44px;background:#fff;padding:4px;border-radius:4px;max-width:50%;object-fit:contain}
header b{color:#fff;font-size:16px;display:block}header small{color:#bbb}
main{max-width:720px;margin:0 auto;padding:10px 14px 90px}
.sum{position:sticky;top:0;z-index:5;background:#fff3b8;color:#3d3200;border:1px solid #e6cf62;padding:8px 10px;font-size:12.5px;font-weight:600;margin:10px 0;border-radius:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 13px;font:600 13px inherit;border-radius:6px;min-height:44px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--y);color:var(--yt);border-color:var(--y)}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:block;min-width:0}.fld.w2{grid-column:1/-1}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input:not([type=checkbox]),select,textarea{width:100%;min-height:44px;background:var(--fld);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--y)}
.muted{color:var(--mut);font-size:12.5px}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--y);flex:none}
.fin{display:grid;grid-template-columns:24px 120px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.fin input[type=checkbox]{width:22px;height:22px;accent-color:var(--y)}
.mes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;padding:12px 14px;border-radius:6px;min-height:46px;cursor:pointer}
.btn.y{background:var(--y);color:var(--yt);border-color:var(--y)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns .btn{flex:1 1 140px}
.note{background:var(--card);border-left:4px solid var(--y);padding:8px 10px;font-size:13px;margin-bottom:10px;border-radius:4px}
#stat{font-size:13px;color:var(--mut);min-height:20px}
.res{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-top:10px}
.res table{width:100%;border-collapse:collapse;font-size:14px}
.res td{padding:6px 0;border-bottom:1px solid var(--line)}.res td:last-child{text-align:right;font-weight:700}
.foto img{max-width:100%;max-height:200px;display:block;margin:8px 0;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90%;display:none}
#dlg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#dlg>div{background:var(--card);padding:16px;border-radius:8px;max-width:420px;width:100%}
[hidden]{display:none!important}
</style></head><body>
<header><img id="logo" alt="Alfa"><div><b>Proposta de Orçamento</b><small>Gera o PDF no próprio aparelho · funciona offline</small></div></header>
<main>
<div class="note" id="note"></div>
<div class="sum" id="sum"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="pane"></div>
<div class="btns"><button class="btn y" id="gen">▶ GERAR PDF</button></div>
<div class="btns"><button class="btn" id="new">NOVA PROPOSTA</button><button class="btn" id="open">ABRIR DADOS</button><button class="btn" id="save">SALVAR DADOS</button></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="fotoin" accept="image/*" hidden>
<div id="stat"></div>
<div class="res" id="res" hidden></div>
</main>
<div id="toast"></div>
<div id="dlg"><div><div id="dlgt" style="white-space:pre-line;margin-bottom:14px"></div><div class="btns" style="margin:0"><button class="btn" id="dno">Voltar</button><button class="btn y" id="dyes">Gerar mesmo assim</button></div></div></div>

  P.texto(18,174.5,_up(d.empresa_endereco),11.5,TEXTO,'semi','esq',125);
  var cepEmp=_txt(d.empresa_cep);

  c.showPage();
  return c.save();
}

function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3200)}
$('#logo').src=ALFA_ASSETS.logoUI;

})();
var TABS=[['cli','Cliente e local'],['sis','Sistema'],['con','Consumo e geração'],['inv','Investimento'],['prop','Proposta']];

  }else if(TAB==='sis'){

      grupo('Inversor',[inp('inversor_qtd','Quantidade'),inp('inversor_potencia','Potência (ex.: 50 kW)'),inp('inversor_marca','Marca'),inp('inversor_modelo','Modelo')])+
      grupo('Painéis',[inp('paineis_qtd','Quantidade'),inp('painel_potencia','Potência (ex.: 610 W)'),inp('painel_marca','Marca'),inp('painel_modelo','Modelo')])+
      grupo('Observações',[inp('observacoes','Aparece na página do projeto','area',0,1)])+
      '<div class="panel foto"><h3>Foto do layout (opcional)</h3><div class="muted">Adiciona a página “Layout preliminar” com a imagem.</div>'+
      (D.foto_layout?'<img alt="Foto do layout" src="data:image/jpeg;base64,'+D.foto_layout.jpg+'"><div class="muted">'+esc(FOTO_NOME)+'</div>':'')+
      '<div class="btns" style="margin-bottom:0"><button class="btn sm" id="fotoBtn" type="button">'+(D.foto_layout?'TROCAR FOTO':'ESCOLHER FOTO')+'</button>'+(D.foto_layout?'<button class="btn sm" id="fotoDel" type="button">REMOVER</button>':'')+'</div></div>';
  }else if(TAB==='con'){
    var meses='';for(var i=1;i<=12;i++)meses+=inp('consumo_'+String(i).padStart(2,'0'),MESES[i-1],'',0,0,' inputmode="decimal"');
    h='<div class="panel"><h3>Consumo do cliente (kWh)</h3><div class="muted">Desmarcado: a média vale para todos os meses. Marcado: informe mês a mês (mês vazio usa a média dos outros).</div>'+chk('consumo_mensal_on','Informar consumo mês a mês')+
      (D.consumo_mensal_on?'<div class="mes">'+meses+'</div>':'<div class="frow">'+inp('consumo_media','Consumo médio por mês (kWh)','',0,1,' inputmode="decimal"')+'</div>')+'</div>'+
      grupo('Geração',[inp('perda','Perdas do sistema (%)','',0,0,' inputmode="decimal"'),inp('geracao_manual','Geração média manual (kWh)','',0,0,' inputmode="decimal"')],'<div class="muted" style="margin-top:8px">Irradiação média de '+IRRADIACAO_LOCAL+'. Com geração manual, o formato do ano é mantido.</div>');
  }else if(TAB==='inv'){
    var fin=[['fin36','Financ. 36x'],['fin48','Financ. 48x'],['fin60','Financ. 60x'],['cartao','Cartão 12x']].map(function(f){return '<div class="fin"><input type="checkbox" data-k="'+f[0]+'_on" data-b="1"'+(D[f[0]+'_on']?' checked':'')+' aria-label="Mostrar '+f[1]+'"><span>'+f[1]+'</span><input data-k="'+f[0]+'" value="'+esc(D[f[0]])+'" placeholder="valor da parcela" inputmode="decimal" autocomplete="off"></div>'}).join('');
    h=grupo('Investimento',[inp('valor_total','Valor total (R$)','',0,0,' inputmode="decimal"'),inp('valor_avista','À vista (R$), vazio = total','',0,0,' inputmode="decimal"')])+
      '<div class="panel"><h3>Parcelas</h3><div class="muted" style="margin-bottom:8px">Desmarque o que não quer mostrar. Cartão vazio = total ÷ 12.</div>'+fin+'<button class="btn sm" id="div12" type="button">TOTAL ÷ 12 NO CARTÃO</button><div class="frow" style="margin-top:10px">'+inp('carencia','Carência (ex.: até 120 dias)','',0,1)+'</div></div>'+
      grupo('Tarifa e Fio B',[inp('tarifa','Tarifa com impostos (R$/kWh)','',0,0,' inputmode="decimal"'),inp('fiob','TUSD Fio B cheio (R$/kWh)','',0,0,' inputmode="decimal"'),inp('reajuste','Reajuste da tarifa (% ao ano)','',0,0,' inputmode="decimal"'),inp('degradacao','Perda dos painéis (% ao ano)','',0,0,' inputmode="decimal"')],'<div class="muted" style="margin-top:8px">Lei 14.300: 60% do Fio B em 2026, 75% em 2027 e 90% de 2028 em diante.</div>');
  }else{
    h=grupo('Pagamento',[inp('transf_banco','Transferência: banco'),inp('transf_agencia','Agência'),inp('transf_conta','Conta'),inp('pix_banco','PIX: banco'),inp('pix_chave','Chave PIX'),inp('pix_titular','Titular')])+
      grupo('Empresa e vendedor',[inp('empresa_nome','Empresa','',0,1),inp('empresa_cnpj','CNPJ'),inp('empresa_cep','CEP'),inp('empresa_endereco','Endereço','',0,1),inp('vendedor','Vendedor','',0,1),inp('data_proposta','Data','',0,0,' inputmode="numeric"'),inp('validade','Validade','',0,0,' inputmode="numeric"')])+
      '<div class="panel"><h3>Páginas da proposta</h3>'+chk('pag_cliente','Dados do cliente e da instalação')+chk('pag_geracao','Geração × consumo')+chk('pag_economia','Economia e retorno')+chk('pag_condicoes','Não incluso e condições gerais')+'</div>'+
      '<div class="panel"><h3>Padrões</h3><div class="muted" style="margin-bottom:8px">Guarda neste aparelho: pagamento, empresa, vendedor, tarifa, Fio B, reajuste, perdas e degradação. Valem para as próximas propostas.</div><button class="btn sm" id="padrao" type="button">SALVAR COMO PADRÃO</button></div>';
  }
  $('#pane').innerHTML=h;

function tabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>'}).join('')}
function resumo(){
  var r=calcular(D),p=[];
  if(r.ok_geracao)p.push('Geração: '+num(r.ger_media)+' kWh/mês');
  if(r.ok_consumo)p.push('Consumo: '+num(r.con_media)+' kWh/mês');
  if(r.cobertura!=null)p.push('Cobertura: '+num(r.cobertura)+'%');
  if(r.ok_economia){p.push('Economia: '+reais(r.eco_mes)+'/mês');p.push('Retorno: '+textoPayback(r.payback))}
  $('#sum').textContent=p.length?p.join('  •  '):'Informe a potência, o consumo e o valor para ver o cálculo.';
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;TAB=b.dataset.t;tabs();pane();window.scrollTo(0,0)});
function onEdit(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.dataset.b){D[k]=el.checked}
  else{
    var v=el.value;
    if(MASCARAS[k]&&e.type==='input'){var f=formatar(MASCARAS[k],v);if(f!==v){el.value=f;v=f}}
    D[k]=v;
  }
  if(k==='ligacao'){D.disjuntor='';pane()}
  if(k==='local_tipo'&&LOCAL_PARA_BASE[D.local_tipo]){D.base_instalacao=LOCAL_PARA_BASE[D.local_tipo];if(e.type==='change')pane()}
  if(k==='consumo_mensal_on')pane();
  if(k==='cep'&&digitos(D.cep).length===8&&e.type==='input')buscarCep();
  resumo();salvarRascunho();
}
$('#pane').addEventListener('input',onEdit);$('#pane').addEventListener('change',onEdit);
function buscarCep(){
  var c=digitos(D.cep);
  try{fetch('https://viacep.com.br/ws/'+c+'/json/').then(function(r){return r.json()}).then(function(j){
    if(j.erro||digitos(D.cep)!==c)return;
    var ender=[j.logradouro,j.bairro].filter(Boolean).join(', ');
    if(!_txt(D.endereco)&&ender)D.endereco=ender;
    if(!_txt(D.cidade)&&j.localidade)D.cidade=j.localidade+' – '+j.uf;
    pane();salvarRascunho();toast('Endereço preenchido pelo CEP.');
  }).catch(function(){})}catch(e){}
}
$('#pane').addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='div12'){var v=lerValor(D.valor_total);if(!v){toast('Informe o valor total antes.');return}D.cartao=num(v/12,2);D.cartao_on=true;pane();salvarRascunho()}
  else if(id==='fotoBtn')$('#fotoin').click();
  else if(id==='fotoDel'){D.foto_layout=null;FOTO_NOME='';pane()}
  else if(id==='padrao'){
    var c={};['transf_banco','transf_agencia','transf_conta','pix_banco','pix_chave','pix_titular','empresa_nome','empresa_cnpj','empresa_endereco','empresa_cep','vendedor','perda','reajuste','degradacao'].forEach(function(k){c[k]=D[k]});
    c.tarifa_padrao=D.tarifa;c.tusd_fiob_padrao=D.fiob;
    toast(salvarConfig(c)?'Padrões salvos neste aparelho.':'Não foi possível salvar neste navegador.');
  }
});
$('#fotoin').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  var url=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var s=Math.min(1,1800/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),cv=document.createElement('canvas');
    cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
    D.foto_layout={w:w,h:h,jpg:cv.toDataURL('image/jpeg',0.85).split(',')[1]};FOTO_NOME=f.name;URL.revokeObjectURL(url);pane();toast('Foto adicionada.');
  };
  im.onerror=function(){toast('Não consegui abrir essa imagem.')};im.src=url;
});
$('#new').addEventListener('click',function(){novo();try{localStorage.removeItem(DRAFT_KEY)}catch(e){}$('#note').textContent='Proposta nova, em branco.';$('#res').hidden=true;$('#stat').textContent='';TAB='cli';tabs();pane();resumo()});
function nomeArquivo(){
  var cli=_txt(D.cliente).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_')||'Cliente';
  var m=String(D.data_proposta||'').match(/(\d{2})\/(\d{2})\/(\d{4})/),dt=m?m[1]+'-'+m[2]+'-'+m[3]:hoje(0).replace(/\//g,'-');
  return 'Proposta_'+cli+'_'+dt;
}
function baixar(blob,nome){
  var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},4000);
}
$('#save').addEventListener('click',function(){
  var c=JSON.parse(JSON.stringify(D));delete c.foto_layout;
  baixar(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}),nomeArquivo()+'.json');toast('Dados salvos em .json');
});
$('#open').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=converterJson(JSON.parse(rd.result));if(!Object.keys(j).length)throw 0;
      D=dadosPadrao();Object.keys(j).forEach(function(k){D[k]=j[k]});FOTO_NOME='';
      $('#note').textContent='Dados abertos: '+f.name;pane();resumo();salvarRascunho();
    }catch(e){toast('Esse arquivo não tem os dados da proposta.')}
  };rd.readAsText(f);
});
var PDF_ATUAL=null;
function avisos(){
  var a=[],r=calcular(D);
  if(!_txt(D.cliente))a.push('Falta o nome do cliente.');
  if(!lerValor(D.valor_total))a.push('Falta o valor total.');
  if(!lerValor(D.potencia_kwp))a.push('Falta a potência (kWp).');
  var w=[];
  if(!r.ok_consumo)w.push('Sem consumo: a página de geração × consumo e a de economia ficam de fora ou incompletas.');
  if(!dataValida(D.data_proposta))w.push('Data da proposta inválida.');
  return {falta:a,avisos:w};
}
function pergunta(txt,cb){$('#dlgt').textContent=txt;$('#dlg').style.display='flex';$('#dyes').onclick=function(){$('#dlg').style.display='none';cb()};$('#dno').onclick=function(){$('#dlg').style.display='none'}}
$('#gen').addEventListener('click',function(){
  var v=avisos();
  if(v.falta.length||v.avisos.length)pergunta(v.falta.concat(v.avisos).join('\n')+'\n\nGerar o PDF mesmo assim?',gerar);else gerar();
});
function gerar(){
  var st=$('#stat');st.textContent='Gerando o PDF…';
  setTimeout(function(){
    try{
      var u8=gerarPdf(D),nome=nomeArquivo()+'.pdf',blob=new Blob([u8],{type:'application/pdf'});PDF_ATUAL={blob:blob,nome:nome};
      var r=calcular(D),rows=[['Arquivo',nome],['Tamanho',num(u8.length/1024)+' KB']];
      if(r.ok_geracao)rows.push(['Geração média',num(r.ger_media)+' kWh/mês']);
      if(r.ok_economia)rows.push(['Economia mensal',reais(r.eco_mes)],['Retorno',textoPayback(r.payback)],['Lucro em 25 anos',reais(r.lucro)]);
      var can=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],nome,{type:'application/pdf'})]}));
      $('#res').innerHTML='<h3 style="margin:0 0 8px">PDF pronto</h3><table>'+rows.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>'}).join('')+'</table><div class="btns"><button class="btn y" id="rbaixar">BAIXAR PDF</button><button class="btn" id="rabrir">ABRIR</button>'+(can?'<button class="btn" id="rshare">COMPARTILHAR</button>':'')+'</div>';
      $('#res').hidden=false;st.textContent='PDF gerado.';
      baixar(blob,nome);$('#res').scrollIntoView({behavior:'smooth',block:'start'});
    }catch(e){st.textContent='Erro ao gerar: '+e.message;console.error(e)}
  },30);
}
$('#res').addEventListener('click',function(e){
  if(!PDF_ATUAL)return;var id=e.target.id;
  if(id==='rbaixar')baixar(PDF_ATUAL.blob,PDF_ATUAL.nome);
  else if(id==='rabrir'){var u=URL.createObjectURL(PDF_ATUAL.blob);window.open(u,'_blank')||(location.href=u)}
  else if(id==='rshare'){navigator.share({files:[new File([PDF_ATUAL.blob],PDF_ATUAL.nome,{type:'application/pdf'})],title:PDF_ATUAL.nome}).catch(function(){})}
});
tabs();pane();resumo();
