<title>Proposta Alfa</title>
<style>
:root{--bg:#f4f4f2;--ink:#1e1e1e;--card:#fff;--line:#d9d9d4}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f1f1ee;--card:#1f1f1f;--line:#3a3a36}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-top:5px solid #F9C801;border-radius:10px;padding:22px 18px;text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:18px;margin:10px 0 14px}
input[type=password]{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:14px}
button{width:100%;font-size:17px;font-weight:700;padding:12px;border:0;border-radius:8px;background:#F9C801;color:#3d3200}
#msg{color:#c0392b;min-height:20px;font-size:14px;margin-top:8px}
