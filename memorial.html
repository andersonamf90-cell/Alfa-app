<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262626">
<link rel="manifest" href="manifest-memorial.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memorial Técnico (Anexo III)</title>
<style>:root{--y:#F9C801;--yt:#3d3200;--bg:#f4f4f2;--card:#fff;--ink:#1e1e1e;--mut:#5c5c5c;--line:#d9d9d4;--dark:#262626;--fld:#fafaf8;--vz:#fff3b8;--vzb:#e0b400}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f1f1ee;--mut:#a8a8a2;--line:#3a3a36;--fld:#2a2a28;--vz:#4a3f0a;--vzb:#c9a400}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--dark);border-bottom:4px solid var(--y);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
header a.home{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:6px 8px 6px 0}
header img{height:44px;background:#fff;padding:4px;border-radius:4px;max-width:40%;object-fit:contain}
header b{color:#fff;font-size:16px;display:block}header small{color:#bbb}
main{max-width:720px;margin:0 auto;padding:10px 14px 90px}
.sum{position:sticky;top:0;z-index:5;background:#fff3b8;color:#3d3200;border:1px solid #e6cf62;padding:8px 10px;font-size:12.5px;font-weight:600;margin:10px 0;border-radius:6px}
.sum.ok{background:#dff5e3;color:#14532d;border-color:#9fd8ab}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:block;min-width:0}.fld.w2{grid-column:1/-1}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:44px;background:var(--fld);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;font-size:16px}
input[data-k],select[data-k],input.up{text-transform:uppercase}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--y)}
.vazio{background:var(--vz)!important;border-color:var(--vzb)!important}
.muted{color:var(--mut);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;padding:12px 14px;border-radius:6px;min-height:46px;cursor:pointer}
.btn.y{background:var(--y);color:var(--yt);border-color:var(--y)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
.btn.on{background:var(--dark);color:var(--y);border-color:var(--dark)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns .btn{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips .btn{flex:none}
.note{background:var(--card);border-left:4px solid var(--y);padding:8px 10px;font-size:13px;margin-bottom:10px;border-radius:4px}
#stat{font-size:13px;color:var(--mut);min-height:20px}
.res{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-top:10px}
.res table{width:100%;border-collapse:collapse;font-size:14px}
.res td{padding:6px 0;border-bottom:1px solid var(--line)}.res td:last-child{text-align:right;font-weight:700;word-break:break-all}
textarea.big{min-height:220px;font:12px/1.4 ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:50;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal>div{background:var(--card);padding:16px;border-radius:8px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.modal.full>div{max-width:720px;height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 13px;font:600 13px inherit;border-radius:6px;min-height:44px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--y);color:var(--yt);border-color:var(--y)}
.carga{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--fld)}
.carga .l1{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center}
.carga .l2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.carga .l2 input{min-height:40px;padding:6px 8px;text-align:center}
.carga .l2 span{font-size:11px;color:var(--mut);display:block;text-align:center}
.carga .calc{font-size:12px;color:var(--mut);margin-top:6px}
.n{font-weight:800;color:var(--mut);text-align:center}
.tot{font-weight:700;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.pd{font-weight:700;padding:10px;border-radius:6px;background:var(--fld);border:1px solid var(--line);margin-top:8px}
.pd.erro{color:#c0392b;border-color:#c0392b}
.foto img{max-width:100%;max-height:220px;display:block;margin:8px auto;border:1px solid var(--line)}
</style></head><body>
<header><a class="home" href="index.html" aria-label="Início">‹</a><img id="logo" alt="Alfa"><div><b>Memorial Técnico — Anexo III</b><small>Memorial descritivo Equatorial · funciona offline</small></div></header>
<main>
<div class="note" id="note"></div>
<div class="sum" id="sum"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="pane"></div>
<div class="btns"><button class="btn y" id="gen">▶ GERAR MEMORIAL (WORD)</button></div>
<div class="btns"><button class="btn" id="new">NOVO CLIENTE</button><button class="btn" id="open">ABRIR CLIENTE (.json)</button><button class="btn" id="save">SALVAR DADOS</button><button class="btn" id="prompt">PROMPT DA IA</button></div>
<div id="stat"></div>
<div class="res" id="res" hidden></div>
</main>
<div id="toast"></div>
<div class="modal" id="dlg"><div><div id="dlgt" style="white-space:pre-line;margin-bottom:14px"></div><div class="btns" style="margin:0"><button class="btn" id="dno">Voltar</button><button class="btn y" id="dyes">Continuar</button></div></div></div>
<div class="modal full" id="pdlg"><div><div class="muted" style="margin-bottom:8px">Copie este texto e cole numa IA junto com os documentos do cliente. Ela devolve o arquivo .json.</div><textarea id="ptxt" class="big" style="flex:1" readonly></textarea><div class="btns"><button class="btn y" id="pcopy">COPIAR TODO O TEXTO</button><button class="btn" id="pclose">FECHAR</button></div></div></div>

var PROMPT_UNICO="VOCÊ VAI EXTRAIR DADOS DE DOCUMENTOS DE UM PROJETO DE MICROGERAÇÃO FOTOVOLTAICA\n(EQUATORIAL ENERGIA – GOIÁS) E GERAR UM ÚNICO ARQUIVO .JSON DO CLIENTE. ESSE MESMO ARQUIVO\nPREENCHE TRÊS DOCUMENTOS: ANEXO I (SOLICITAÇÃO DE ORÇAMENTO), ANEXO III (MEMORIAL TÉCNICO)\nE A PROCURAÇÃO. POR ISSO, EXTRAIA TUDO O QUE ESTIVER NOS DOCUMENTOS.\n\nVOU ENVIAR:\n- DOCUMENTOS DO CLIENTE: RG/CNH, CONTA DE ENERGIA, ARQUIVO DE DADOS (SE HOUVER);\n- DATASHEET DO MÓDULO E DO INVERSOR;\n- DADOS DE PROJETO NA MENSAGEM (QUANTIDADES, PADRÃO DE ENTRADA, DISJUNTOR ETC.).\n\nREGRAS GERAIS\n1. TODOS OS TEXTOS EM LETRA MAIÚSCULA (E-MAIL PODE FICAR COMO ESTÁ).\n2. NÃO INVENTE NADA. O QUE NÃO ESTIVER NOS DOCUMENTOS OU NA MENSAGEM FICA \"\".\n   SE DOIS DOCUMENTOS SE CONTRADIZEM (EX.: CONTA EM NOME DE OUTRA PESSOA), USE O QUE BATE\n   COM O CLIENTE E AVISE FORA DO ARQUIVO.\n3. NÚMEROS COM VÍRGULA DECIMAL (EX.: 14,6) E SEM UNIDADE. EXCEÇÃO: projeto.tensao_rede (\"440V\").\n4. DATAS NO FORMATO DD/MM/AAAA.\n5. CAMPOS DE LISTA SÓ ACEITAM OS VALORES PERMITIDOS (LISTA NO FIM).\n6. NÃO VÃO NO JSON (OS PROGRAMAS JÁ TÊM FIXO OU O USUÁRIO ESCOLHE NA TELA):\n   RESPONSÁVEL TÉCNICO, PROCURADOR, FP DA PD, CURVA/kA/ACIONAMENTO DO DISJUNTOR, CAIXA DE\n   MEDIÇÃO, DPS, ATERRAMENTO, CABOS, IMAGEM DA UC E LEVANTAMENTO DE CARGA.\n\nCAMPO A CAMPO\ncliente (RG/CNH E ARQUIVO DE DADOS)\n- nome: NOME COMPLETO DO TITULAR.\n- cpf_cnpj: CPF 000.000.000-00 (OU CNPJ).          <- NÃO ESQUEÇA\n- rg: SÓ O NÚMERO.   - rg_orgao_uf: ÓRGÃO/UF (EX.: SSP/GO).\n- rg_data_expedicao: DATA DE EXPEDIÇÃO DO RG (DD/MM/AAAA).\n- telefone_celular: \"(DD) NNNNN-NNNN\".             <- NÃO ESQUEÇA\n- email.\nendereco (DA UNIDADE CONSUMIDORA – CONTA DE ENERGIA)\n- logradouro: COM O TIPO, SEM QUADRA/LOTE (EX.: RUA DUQUE DE CAXIAS, FAZENDA MORRO DO CHAPÉU).\n- numero: NÚMERO OU \"S/N\".   - quadra: SÓ O NÚMERO (EX.: 6).   - lote: SÓ O NÚMERO (EX.: 1-A).\n- setor_bairro: SETOR/BAIRRO (OU \"ZONA RURAL\").   - cidade: SÓ O NOME.   - u \", \"quadra\": \"\", \"lote\": \"\", \"setor_bairro\": \"\",\n               \"cidade\": \"\", \"uf\": \"\", \"cep\": \"\"},\n  \"unidade_consumidora\": {\"conta_contrato\": \"\", \"classe\": \"\", \"poste_ou_trafo\": \"\", \"tensao_v\": \"\",\n               \"tipo_solicitacao\": \"\", \"ramo_atividade\": \"\", \"tipo_ramal\": \"\", \"cargas_especiais\": \"\"},\n  \"projeto\": {\"tipo_geracao_desc\": \"\", \"potencia_sistema_kw\": \"\", \"tensao_rede\": \"\",\n              \"caracterizacao\": \"\", \"composicao\": \"\", \"concessionaria\": \"\", \"estado\": \"\",\n              \"mes_ano\": \"\", \"coordenadas\": \"\", \"tipo_ligacao\": \"\", \"num_condutores\": \"\",\n              \"num_fases_cond\": \"\", \"secao_fase_mm2\": \"\", \"secao_neutro_mm2\": \"\",\n              \"tensao_atendimento\": \"\", \"dj_polos\": \"\", \"dj_tensao\": \"\", \"dj_corrente\": \"\",\n              \"pd_vn\": \"\", \"pd_idg\": \"\", \"pd_nf\": \"\",\n              \"prot_ca_polos\": \"\", \"prot_ca_tensao\": \"\", \"prot_ca_corrente\": \"\"},\n  \"geracao\": {\"modalidade_compensacao\": \"\", \"data_inicio_operacao\": \"\"},\n  \"modulo\": {\"fabricante\": \"\", \"modelo\": \"\", \"pn_w\": \"\", \"voc\": \"\", \"isc\": \"\", \"vpmp\": \"\",\n             \"ipmp\": \"\", \"eficiencia\": \"\", \"comprimento\": \"\", \"largura\": \"\", \"area\": \"\",\n             \"peso\": \"\", \"quantidade\": \"\", \"pot_kw\": \"\"},\n  \"inversor\": {\"fabricante\": \"\", \"modelo\": \"\", \"quantidade\": \"\", \"pn_kw\": \"\", \"pmax_cc\": \"\",\n               \"vcc_max\": \"\", \"icc_max\": \"\", \"vpmp_max\": \"\", \"vpmp_min\": \"\", \"vcc_part\": \"\",\n               \"qtd_strings\": \"\", \"qtd_mppt\": \"\", \"pca\": \"\", \"pca_max\": \"\", \"imax_ca\": \"\",\n               \"vnom_ca\": \"\", \"fn\": \"\", \"vca_max\": \"\", \"vca_min\": \"\", \"thd\": \"\", \"fp\": \"\",\n               \"tipo_conexao\": \"\", \"efic_max\": \"\"}\n}\n\nENTREGA\nGERE O ARQUIVO .JSON PARA DOWNLOAD, CO /* ===== base comum das ferramentas Alfa (Procuração, Memorial, Textos AutoCAD) ===== */
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3400)}
function getP(d,c){var ks=c.split('.');for(var i=0;i<ks.length;i++){d=(d&&typeof d==='object')?d[ks[i]]:undefined}return (typeof d==='string'||typeof d==='number')?String(d):''}
function setP(d,c,v){var ks=c.split('.'),cur=d;for(var i=0;i<ks.length-1;i++){if(typeof cur[ks[i]]!=='object'||!cur[ks[i]])cur[ks[i]]={};cur=cur[ks[i]]}cur[ks[ks.length-1]]=v}
function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function soDig(v){return String(v==null?'':v).replace(/\D/g,'')}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nomeArquivo(n){n=semAcento(n).replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_');return n||'cliente'}
function baixar(blob,nome){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},4000)}
function lerArquivoTexto(cb){var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){cb(r.result,f.name)};r.readAsText(f)};i.click()}

/* ---------- caixas de diálogo ---------- */
function pergunta(txt,sim,cb,nao){
  var m=$('#dlg');$('#dlgt').textContent=txt;$('#dyes').textContent=sim||'Continuar';$('#dno').textContent=nao||'Voltar';m.style.display='flex';
  $('#dyes').onclick=function(){m.style.display='none';cb()};$('#dno').onclick=function(){m.style.display='none'};
}
function mostrarPrompt(){$('#ptxt').value=PROMPT_UNICO;$('#pdlg').style.display='flex'}
function iniciarPrompt(){
  $('#pclose').onclick=function(){$('#pdlg').style.display='none'};
  $('#pcopy').onclick=function(){var t=$('#ptxt');t.select();t.setSelectionRange(0,999999);var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast('Texto copiado.')},function(){toast('Selecione e copie manualmente.')});else toast(ok?'Texto copiado.':'Selecione e copie manualmente.')};
}

/* ---------- campos: maiúsculas, amarelo quando vazio, contador ---------- */
var CAMPOS_OPCIONAIS={};
function marcarVazios(){
  var n=0,lst=[];
  document.querySelectorAll('[data-k]').forEach(function(el){
    var vz=!String(el.value||'').trim(),opc=CAMPOS_OPCIONAIS[el.dataset.k];
    el.classList.toggle('vazio',vz&&!opc);
    if(vz&&!opc){n++;lst.push(el.dataset.rot||el.dataset.k)}
  });
  var s=$('#sum');
  if(s){s.classList.toggle('ok',n===0);s.textContent=n?('⚠ FALTAM '+n+' CAMPO(S) — os campos em amarelo estão vazios'):'✓ Todos os campos preenchidos'}
  return lst;
}
function confirmarVazios(cb){
  var f=marcarVazios();if(!f.length){cb();return}
  var l=f.slice(0,20).map(function(x){return '• '+x}).join('\n')+(f.length>20?'\n• … e mais '+(f.length-20):'');
  pergunta('Existem '+f.length+' campo(s) sem preencher (em amarelo):\n\n'+l+'\n\nGerar mesmo assim?','Gerar mesmo assim',cb);
}
function campoHtml(rot,k,v,opcoes,extra){
  extra=extra||{};var h,at=' data-k="'+k+'" data-rot="'+esc(rot)+'"';
  if(opcoes){
    var o='<option value=""></option>'+opcoes.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('');
    if(v&&opcoes.indexOf(v)<0)o+='<option selected>'+esc(v)+'</option>';
    h='<select'+at+'>'+o+'</select>';
  }else h='<input'+at+' value="'+esc(v)+'" autocomplete="off"'+(extra.num?' inputmode="decimal"':'')+'>';
  return '<label class="fld'+(extra.w2?' w2':'')+'"><span>'+esc(rot)+(CAMPOS_OPCIONAIS[k]?' <i>(opcional)</i>':'')+'</span>'+h+'</label>';
}
/* liga os campos ao objeto D: tudo em maiúscula, rascunho guardado no aparelho */
function ligarCampos(raiz,D,aoMudar){
  function ed(e){
    var el=e.target,k=el.dataset.k;if(!k)return;
    if(el.tagName==='INPUT'){var up=el.value.toUpperCase();if(up!==el.value){var p=el.selectionStart;el.value=up;try{el.setSelectionRange(p,p)}catch(x){}}}
    setP(D(),k,el.value);marcarVazios();if(aoMudar)aoMudar(k,el);
  }
  raiz.addEventListener('input',ed);raiz.addEventListener('change',ed);
}

/* ---------- resultado: baixar, abrir, compartilhar ---------- */
var ARQ_ATUAL=null;
function podeCompartilhar(blob,nome){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([blob],nome,{type:blob.type})]}))}catch(e){return false}}
function compartilhar(blob,nome,texto){
  var f=new File([blob],nome,{type:blob.type});
  if(navigator.share&&podeCompartilhar(blob,nome))navigator.share({files:[f],title:nome,text:texto||''}).catch(function(){});
  else{baixar(blob,nome);toast('Este navegador não compartilha arquivos. O arquivo foi baixado.')}
}
function pronto(u8,nome,mime,titulo,dica){
  var blob=new Blob([u8],{type:mime});ARQ_ATUAL={blob:blob,nome:nome};
  var r=$('#res'),pdf=/pdf$/.test(mime);
  r.innerHTML='<h3 style="margin:0 0 8px">'+esc(titulo)+'</h3><table><tr><td>Arquivo</td><td>'+esc(nome)+'</td></tr><tr><td>Tamanho</td><td>'+Math.max(1,Math.round(u8.length/1024))+' KB</td></tr></table>'+

function escolheuCarga(i){
  var c=CARG[i],n=c.descricao;
  if(CARGAS[n]){var x=CARGAS[n];c.p=fmtN(x[0]);c.fp=x[1]===1?fmtN(x[1]):fmt2(x[1]);c.fd=fmt2(x[2]);if(!String(c.quant).trim())c.quant='1';return true}
  if(!n){c.p=c.quant=c.fp=c.fd='';return true}
  return false;
}

$('#pane').addEventListener('input',function(e){
  var el=e.target;if(el.dataset.c==null)return;var i=+el.dataset.c,f=el.dataset.f;
  if(f==='descricao'){var up=el.value.toUpperCase();if(up!==el.value)el.value=up}
  CARG[i][f]=el.value;
  if(f==='descricao'&&escolheuCarga(i)){var box=el.closest('.carga');['p','quant','fp','fd'].forEach(function(k){box.querySelector('[data-f="'+k+'"]').value=CARG[i][k]})}
  recalc();salvarRasc();

  var b=e.target.closest('button');if(!b)return;

    ['projeto.pd_idg','projeto.dj_corrente','projeto.secao_fase_mm2','projeto.secao_neutro_mm2'].forEach(function(k){setP(D,k,'')});pane();salvarRasc();toast('Padrão aplicado. Agora escolha o disjuntor.')}
  else if(b.dataset.dj){var a=b.dataset.dj,bt=BITOLAS[PRESET][a];setP(D,'projeto.pd_idg',a);setP(D,'projeto.dj_corrente',a);setP(D,'projeto.secao_fase_mm2',bt[0]);setP(D,'projeto.secao_neutro_mm2',bt[1]);pane();salvarRasc()}
  else if(b.id==='cpadrao'){CARG=CARGAS_PADRAO.map(function(x){var c=novaCarga();c.descricao=x[0];c.quant=String(x[1]);return c});CARG.forEach(function(c,i){escolheuCarga(i)});pane();salvarRasc()}
  else if(b.id==='climpar'){CARG=[];while(CARG.length<N_CARGAS)CARG.push(novaCarga());pane();salvarRasc()}
  else if(b.id==='imgadd')escolherImagem();
  else if(b.id==='imgrm'){IMG=null;pane()}
});
/* imagem: reduz no aparelho e guarda como JPEG (o memorial não fica pesado) */
function escolherImagem(){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){var max=1800,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
      cv.toBlob(function(bl){bl.arrayBuffer().then(function(ab){IMG={u8:new Uint8Array(ab),w:w,h:h,url:URL.createObjectURL(bl)};URL.revokeObjectURL(url);pane();toast('Imagem adicionada.')})},'image/jpeg',0.88)};
    im.onerror=function(){toast('Não consegui abrir essa imagem.')};im.src=url};
  inp.click();
}
function deJson(j){
  ORIG=clone(j);var d=clone(j);
  if(Array.isArray(d.modulos)&&d.modulos.length&&!(d.modulo&&Object.keys(d.modulo).length))d.modulo=d.modulos[0];
  if(Array.isArray(d.inversores)&&d.inversores.length&&!(d.inversor&&Object.keys(d.inversor).length))d.inversor=d.inversores[0];
  var n=novoD();chaves().forEach(function(k){var v=getP(d,k);if(v!=='')setP(n,k,v.toUpperCase())});
  Object.keys(TECNICO).forEach(function(k){if(!getP(n,k))setP(n,k,TECNICO[k])});
  D=n;CARG=[];(d.levantamento_carga||[]).slice(0,N_CARGAS).forEach(function(x,i){var c=novaCarga();Object.keys(c).forEach(function(k){c[k]=String(x[k]==null?'':x[k])});CARG.push(c);if(CARGAS[c.descricao]&&!c.p.trim())escolheuCarga(i)});
  while(CARG.length<N_CARGAS)CARG.push(novaCarga());PRESET=null;
}
function coletar(){
  var d=clone(ORIG);chaves().forEach(function(k){setP(d,k,getP(D,k))});
  d.levantamento_carga=CARG.filter(function(c){return String(c.descricao).trim()||String(c.p).trim()});return d;
}
