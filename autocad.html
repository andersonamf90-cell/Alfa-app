<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262626">
<link rel="manifest" href="manifest-autocad.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Textos do AutoCAD</title>
<style>:root{--y:#F9C801;--yt:#3d3200;--bg:#f4f4f2;--card:#fff;--ink:#1e1e1e;--mut:#5c5c5c;--line:#d9d9d4;--dark:#262626;--fld:#fafaf8;--vz:#fff3b8;--vzb:#e0b400}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f1f1ee;--mut:#a8a8a2;--line:#3a3a36;--fld:#2a2a28;--vz:#4a3f0a;--vzb:#c9a400}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--dark);border-bottom:4px solid var(--y);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
header a.home{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:6px 8px 6px 0}
header img{height:44px;background:#fff;padding:4px;border-radius:4px;max-width:40%;object-fit:contain}
header b{color:#fff;font-size:16px;display:block}header small{color:#bbb}
main{max-width:720px;margin:0 auto;padding:10px 14px 90px}
.sum{position:sticky;top:0;z-index:5;background:#fff3b8;color:#3d3200;border:1px solid #e6cf62;padding:8px 10px;font-size:12.5px;font-weight:600;margin:10px 0;border-radius:6px}
.sum.ok{background:#dff5e3;color:#14532d;border-color:#9fd8ab}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:block;min-width:0}.fld.w2{grid-column:1/-1}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:44px;background:var(--fld);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;font-size:16px}
input[data-k],select[data-k],input.up{text-transform:uppercase}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--y)}
.vazio{background:var(--vz)!important;border-color:var(--vzb)!important}
.muted{color:var(--mut);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;padding:12px 14px;border-radius:6px;min-height:46px;cursor:pointer}
.btn.y{background:var(--y);color:var(--yt);border-color:var(--y)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
.btn.on{background:var(--dark);color:var(--y);border-color:var(--dark)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns .btn{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips .btn{flex:none}
.note{background:var(--card);border-left:4px solid var(--y);padding:8px 10px;font-size:13px;margin-bottom:10px;border-radius:4px}
#stat{font-size:13px;color:var(--mut);min-height:20px}
.res{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:6px;padding:12px;margin-top:10px}
.res table{width:100%;border-collapse:collapse;font-size:14px}
.res td{padding:6px 0;border-bottom:1px solid var(--line)}.res td:last-child{text-align:right;font-weight:700;word-break:break-all}
textarea.big{min-height:220px;font:12px/1.4 ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:50;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal>div{background:var(--card);padding:16px;border-radius:8px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.modal.full>div{max-width:720px;height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}

.txt{background:var(--fld);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.txt pre{margin:0 0 8px;white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace}
.txt .btn{width:100%}
.aviso{background:#fde8e8;color:#8a1c1c;border:1px solid #f1b0b0;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px;white-space:pre-line}
@media(prefers-color-scheme:dark){.aviso{background:#3a1515;color:#ffb3b3;border-color:#6b2a2a}}
</style></head><body>

<div class="sum" id="sum"></div>
<div id="campos"></div>
<div class="btns"><button class="btn" id="new">LIMPAR</button><button class="btn" id="open">ABRIR CLIENTE (.json)</button><button class="btn" id="txt">⤴ COMPARTILHAR .TXT</button></div>
<div id="avisos"></div>
<div class="panel"><h3>Textos prontos</h3><div id="textos"></div></div>
</main>
<div id="toast"></div>

var PROMPT_UNICO="";
/* ===== base comum das ferramentas Alfa (Procuração, Memorial, Textos AutoCAD) ===== */
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3400)}
function getP(d,c){var ks=c.split('.');for(var i=0;i<ks.length;i++){d=(d&&typeof d==='object')?d[ks[i]]:undefined}return (typeof d==='string'||typeof d==='number')?String(d):''}
function setP(d,c,v){var ks=c.split('.'),cur=d;for(var i=0;i<ks.length-1;i++){if(typeof cur[ks[i]]!=='object'||!cur[ks[i]])cur[ks[i]]={};cur=cur[ks[i]]}cur[ks[ks.length-1]]=v}
function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function soDig(v){return String(v==null?'':v).replace(/\D/g,'')}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nomeArquivo(n){n=semAcento(n).replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_');return n||'cliente'}
function baixar(blob,nome){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},4000)}
function lerArquivoTexto(cb){var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){cb(r.result,f.name)};r.readAsText(f)};i.click()}

/* ---------- caixas de diálogo ---------- */
function pergunta(txt,sim,cb,nao){
  var m=$('#dlg');$('#dlgt').textContent=txt;$('#dyes').textContent=sim||'Continuar';$('#dno').textContent=nao||'Voltar';m.style.display='flex';
  $('#dyes').onclick=function(){m.style.display='none';cb()};$('#dno').onclick=function(){m.style.display='none'};
}
function mostrarPrompt(){$('#ptxt').value=PROMPT_UNICO;$('#pdlg').style.display='flex'}
function iniciarPrompt(){
  $('#pclose').onclick=function(){$('#pdlg').style.display='none'};
  $('#pcopy').onclick=function(){var t=$('#ptxt');t.select();t.setSelectionRange(0,999999);var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast('Texto copiado.')},function(){toast('Selecione e copie manualmente.')});else toast(ok?'Texto copiado.':'Selecione e copie manualmente.')};
}

/* ---------- campos: maiúsculas, amarelo quando vazio, contador ---------- */
var CAMPOS_OPCIONAIS={};
function marcarVazios(){
  var n=0,lst=[];
  document.querySelectorAll('[data-k]').forEach(function(el){
    var vz=!String(el.value||'').trim(),opc=CAMPOS_OPCIONAIS[el.dataset.k];
    el.classList.toggle('vazio',vz&&!opc);
    if(vz&&!opc){n++;lst.push(el.dataset.rot||el.dataset.k)}
  });
  var s=$('#sum');
  if(s){s.classList.toggle('ok',n===0);s.textContent=n?('⚠ FALTAM '+n+' CAMPO(S) — os campos em amarelo estão vazios'):'✓ Todos os campos preenchidos'}
  return lst;
}
function confirmarVazios(cb){
  var f=marcarVazios();if(!f.length){cb();return}
  var l=f.slice(0,20).map(function(x){return '• '+x}).join('\n')+(f.length>20?'\n• … e mais '+(f.length-20):'');
  pergunta('Existem '+f.length+' campo(s) sem preencher (em amarelo):\n\n'+l+'\n\nGerar mesmo assim?','Gerar mesmo assim',cb);
}
function campoHtml(rot,k,v,opcoes,extra){
  extra=extra||{};var h,at=' data-k="'+k+'" data-rot="'+esc(rot)+'"';
  if(opcoes){
    var o='<option value=""></option>'+opcoes.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('');
    if(v&&opcoes.indexOf(v)<0)o+='<option selected>'+esc(v)+'</option>';
    h='<select'+at+'>'+o+'</select>';
  }else h='<input'+at+' value="'+esc(v)+'" autocomplete="off"'+(extra.num?' inputmode="decimal"':'')+'>';
  return '<label class="fld'+(extra.w2?' w2':'')+'"><span>'+esc(rot)+(CAMPOS_OPCIONAIS[k]?' <i>(opcional)</i>':'')+'</span>'+h+'</label>';
}
/* liga os campos ao objeto D: tudo em maiúscula, rascunho guardado no aparelho */
function ligarCampos(raiz,D,aoMudar){
  function ed(e){
    var el=e.target,k=el.dataset.k;if(!k)return;
    if(el.tagName==='INPUT'){var up=el.value.toUpperCase();if(up!==el.value){var p=el.selectionStart;el.value=up;try{el.setSelectionRange(p,p)}catch(x){}}}
    setP(D(),k,el.value);marcarVazios();if(aoMudar)aoMudar(k,el);
  }
  raiz.addEventListener('input',ed);raiz.addEventListener('change',ed);
}

/* ---------- resultado: baixar, abrir, compartilhar ---------- */
var ARQ_ATUAL=null;
function podeCompartilhar(blob,nome){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([blob],nome,{type:blob.type})]}))}catch(e){return false}}
function compartilhar(blob,nome,texto){
  var f=new File([blob],nome,{type:blob.type});
  if(navigator.share&&podeCompartilhar(blob,nome))navigator.share({files:[f],title:nome,text:texto||''}).catch(function(){});
  else{baixar(blob,nome);toast('Este navegador não compartilha arquivos. O arquivo foi baixado.')}
}
function pronto(u8,nome,mime,titulo,dica){
  var blob=new Blob([u8],{type:mime});ARQ_ATUAL={blob:blob,nome:nome};
  var r=$('#res'),pdf=/pdf$/.test(mime);
  r.innerHTML='<h3 style="margin:0 0 8px">'+esc(titulo)+'</h3><table><tr><td>Arquivo</td><td>'+esc(nome)+'</td></tr><tr><td>Tamanho</td><td>'+Math.max(1,Math.round(u8.length/1024))+' KB</td></tr></table>'+
    (dica?'<div class="muted" style="margin-top:8px">'+dica+'</div>':'')+
    '<div class="btns"><button class="btn y" id="rshare">⤴ COMPARTILHAR</button><button class="btn" id="rbaixar">⇩ BAIXAR</button>'+(pdf?'<button class="btn" id="rabrir">▶ ABRIR</button>':'')+'</div>';
  r.hidden=false;$('#stat').textContent=titulo+'.';
  r.onclick=function(e){
    var id=e.target.id;if(!ARQ_ATUAL)return;
    if(id==='rbaixar')baixar(ARQ_ATUAL.blob,ARQ_ATUAL.nome);
    else if(id==='rabrir'){var u=URL.createObjectURL(ARQ_ATUAL.blob);window.open(u,'_blank')||(location.href=u)}
    else if(id==='rshare')compartilhar(ARQ_ATUAL.blob,ARQ_ATUAL.nome);
  };
  r.scrollIntoView({behavior:'smooth',block:'start'});
}
function registrarSW(){if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}}

var CP1252=[0x20AC,0,0x201A,0x0192,0x201E,0x2026,0x2020,0x2021,0x02C6,0x2030,0x0160,0x2039,0x0152,0,0x017D,0,0,0x2018,0x2019,0x201C,0x201D,0x2022,0x2013,0x2014,0x02DC,0x2122,0x0161,0x203A,0x0153,0,0x017E,0x0178];
function toWin(s){var o='';s=String(s).replace(/\u2264/g,'<=').replace(/\u2265/g,'>=').replace(/\u2192/g,'->');for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<128||(c>=160&&c<=255))o+=s[i];else{var k=CP1252.indexOf(c);o+=(k>=0&&c)?String.fromCharCode(128+k):'?'}}return o}
function helvW(t,sz,b){var w=b?HELV_W.b:HELV_W.r,s=0,x=toWin(t);for(var i=0;i<x.length;i++)s+=w[x.charCodeAt(i)]||0;return s*sz/1000}
function f3x(n){var s=(Math.round(n*1000)/1000).toString();return s==='-0'?'0':s}
function escPdf(t){return toWin(t).replace(/[\\()]/g,'\\$&').replace(/[\x80-\xff]/g,function(c){return '\\'+('00'+c.charCodeAt(0).toString(8)).slice(-3)})}
function hexU(s){var h='FEFF';s=String(s||'');for(var i=0;i<s.length;i++)h+=('0000'+s.charCodeAt(i).toString(16)).slice(-4);return '<'+h.toUpperCase()+'>'}
/* monta um PDF de 1 página: imagem JPEG de fundo (base64) + comandos de desenho */
function pdfUmaPagina(W,H,jpgB64,imgW,imgH,conteudo,titulo){
  var objs=[];function add(s){objs.push(s);return objs.length}
  add('<< /Type /Catalog /Pages 2 0 R >>');add('<< /Type /Pages /Count 1 /Kids [7 0 R] >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var jpg=atob(jpgB64);
  add('<< /Type /XObject /Subtype /Image /Width '+imgW+' /Height '+imgH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n'+jpg+'\nendstream');
  var dc='q '+f3x(W)+' 0 0 '+f3x(H)+' 0 0 cm /Im1 Do Q\n'+conteudo;
  add('<< /Length '+dc.length+' >>\nstream\n'+dc+'\nendstream');
  add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f3x(W)+' '+f3x(H)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> /ProcSet [/PDF /Text /ImageC] >> /Contents 6 0 R >>');
  var info=add('<< /Title '+hexU(titulo||'')+' /Producer (Alfa) >>');
  var out='%PDF-1.4\n%\xe2\xe3\xcf\xd3\n',offs=[];
  for(var i=0;i<objs.length;i++){offs.push(out.length);out+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'}
  var xr=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';offs.forEach(function(o){out+=('0000000000'+o).slice(-10)+' 00000 n \n'});
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var u=new Uint8Array(out.length);for(var k=0;k<out.length;k++)u[k]=out.charCodeAt(k)&255;return u;
}

function num(v){var m=/-?\d+(?:[.,]\d+)?/.exec(String(v==null?'':v));return m?parseFloat(m[0].replace(',','.')):null}
function fmt(v,c){if(v==null)return '';var t=v.toFixed(c==null?2:c).replace(/0+$/,'').replace(/\.$/,'');return (t==='-0'||t==='')?'0':t}
function vazioD(){var o={};CAMPOS.forEach(function(s){s[1].forEach(function(f){o[f[1]]=''})});o.s1_qtd='1';return o}

function deJson(d){
  var mod=d.modulo||((d.modulos||[{}])[0])||{},inv=d.inversor||((d.inversores||[{}])[0])||{};
  var qi=num(inv.quantidade)||1,pi=num(inv.pn_kw||inv.potencia_nominal_kw),lig=String(inv.tipo_conexao||'');
  var fases=/^3/.test(lig)?'TRIFÁSICO':(/^1/.test(lig)?'MONOFÁSICO':'');
  if(!fases){var f=String((d.projeto||{}).tipo_ligacao||'').toUpperCase();fases=/TRI/.test(f)?'TRIFÁSICO':(f?'MONOFÁSICO':'')}
  var vca=(inv.vca_min&&inv.vca_max)?inv.vca_min+'-'+inv.vca_max+'V':'',temInv=Object.keys(inv).length>0;
  var v={i_fab:inv.fabricante||'',i_modelo:inv.modelo||'',i_qtd:temInv?fmt(qi):'',i_fases:fases,i_vdc:fmt(num(inv.vcc_max)),i_idc:fmt(num(inv.icc_max)),
    i_iac:fmt(num(inv.imax_ca||inv.corrente_nominal_a)),i_vac:fmt(num(inv.vnom_ca)),i_vac_faixa:vca,i_pot:fmt(pi),
    m_fab:mod.fabricante||'',m_modelo:String(mod.modelo||'').replace(/\s*\d{3}\s*W$/,''),m_qtd:fmt(num(mod.quantidade)),m_pmp:fmt(num(mod.pn_w||mod.potencia_w)),
    m_vmp:fmt(num(mod.vpmp)),m_voc:fmt(num(mod.voc)),m_imp:fmt(num(mod.ipmp)),m_isc:fmt(num(mod.isc)),s1_qtd:'1',s1_mod:fmt(num(mod.quantidade)),s2_qtd:'',s2_mod:''};
  Object.keys(v).forEach(function(k){v[k]=String(v[k]).toUpperCase()});return v;
}
function montarTextos(){
  var av=[],g=function(k){return String(D[k]||'').trim()};
  var mq=num(g('m_qtd')),mp=num(g('m_pmp')),iq=num(g('i_qtd')),ip=num(g('i_pot'));
  var kwp=(mq&&mp)?fmt(mq*mp/1000):'',kw=(iq&&ip)?fmt(iq*ip):g('i_pot'),faixa=g('i_vac_faixa')?' ('+g('i_vac_faixa')+')':'';
  var inversor=['INVERSOR STRING',g('i_fab')+'  '+g('i_modelo')+' '+g('i_fases'),'TENSÃO DC MAX ENTRADA: '+g('i_vdc')+'V','CORRENTE MAX DC DE ENTRADA: '+g('i_idc')+'A / MPPT',
    'CORRENTE DE SAÍDA MAX Iac: '+g('i_iac')+'A','TENSÃO NOMINAL DE SAÍDA Vac: '+g('i_vac')+'V'+faixa,'POTÊNCIA DE SAÍDA MAX: '+g('i_pot')+' KW'].join('\n');
  var pm=mq!==1?'Módulos Fotovoltaicos':'Módulo Fotovoltaico',pinv=(iq||1)>1?'Inversores':'Inversor';
  var potencia=['POTÊNCIA INSTALADA DE PAINÉIS '+kwp+' kWp','POTÊNCIA TOTAL INSTALADA/INVERSORES '+kw+' kW','','Sistema Gerador Fotovoltaico composto por:',
    '1:  '+g('m_qtd')+' '+pm+' de '+g('m_pmp')+' Wp, marca '+g('m_fab')+', modelo '+g('m_modelo')+' ;',
    '2:  '+g('i_qtd')+' '+pinv+' marca '+g('i_fab')+', modelo '+g('i_modelo')+' , potência pico '+g('i_pot')+' kW,','com as seguintes funções:',
    '        2.1 Elementos de proteção de sub e sobretensão;','        2.2 Elementos de proteção de sub e sobrefrequência;','        2.3 Relé de sincronismo;',
    '        2.4 Elemento de proteção anti-ilhamento, com desligamento automático.'].join('\n');
  var modulo=['MODULO FOTOVOLTAICO',g('m_fab')+' '+g('m_modelo'),'POTENCIA DE OPERAÇÃO (Pmp): '+g('m_pmp')+'W','TENSÃO DE OPERAÇÃO (Vmp): '+g('m_vmp')+'V',
    'TENSÃO DE CIRCUITO ABERTO (Voc): '+g('m_voc')+'V','CORRENTE DE OPERAÇÃO (Imp stc): '+g('m_imp')+'A','CORRENTE DE CURTO-CIRCUITO (Isc): '+g('m_isc')+'A'].join('\n');
  var vmp=num(g('m_vmp')),voc=num(g('m_voc')),vmax=num(g('i_vdc')),series=[],total=0;
  [1,2].forEach(function(i){
    var q=num(g('s'+i+'_qtd')),n=num(g('s'+i+'_mod'));if(!n){series.push('');return}
    q=Math.trunc(q||1);n=Math.trunc(n);total+=q*n;
    series.push([q+' X SÉRIE FOTOVOLTAICA','MÓDULOS EM SÉRIE: '+n,'POTENCIA DE OPERAÇÃO (Pmp): '+fmt(mp?mp*n:null)+'W','TENSÃO DE OPERAÇÃO (Vmp): '+fmt(vmp?vmp*n:null)+'V',
      'TENSÃO DE CIRCUITO ABERTO (Voc): '+fmt(voc?voc*n:null)+'V','CORRENTE DE OPERAÇÃO (Imp stc): '+g('m_imp')+'A','CORRENTE DE CURTO-CIRCUITO (Isc): '+g('m_isc')+'A'].join('\n'));
    if(voc&&vmax&&voc*n>vmax)av.push('Série '+i+' ('+n+' módulos): Voc = '+fmt(voc*n)+' V passa da tensão DC máxima do inversor ('+fmt(vmax)+' V).');
  });
  if(total&&mq&&total!==Math.trunc(mq))av.push('As séries somam '+total+' módulos, mas a quantidade total é '+Math.trunc(mq)+'.');
  return {t:[['INVERSOR',inversor],['POTÊNCIA E COMPOSIÇÃO',potencia],['MÓDULO',modulo],['SÉRIE FOTOVOLTAICA 1',series[0]],['SÉRIE FOTOVOLTAICA 2',series[1]]],a:av};
}

function copiar(t){
  function ok(){toast('Texto copiado. Cole no AutoCAD (Ctrl+V).')}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,velho);else velho();
  function velho(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Selecione e copie manualmente.')}a.remove()}
}
